# Govee Pixel (custom firmware) - Home Assistant package: notification examples
#
# Install: copy to <config>/packages/govee_pixel.yaml and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then edit every line marked  # <-- CHANGE  and restart Home Assistant.
#
# Info screens are designed in pixel2mqtt and fed from Home Assistant by it (see docs/SCREENS.md); they need no
# package. Other useful topics:
#   govee-pixel/notify/set   {"message": "...", "duration": 15, "color": "#ff3300", "sound": "Ding Dong", "animation": "Danger Approaching"}
#   govee-pixel/countdown/set "5:00" | "300" | "stop"        govee-pixel/stopwatch/set start|stop|toggle|reset
#   govee-pixel/effect/set "Snake"   govee-pixel/animation/set "Lighthouse"   govee-pixel/music_style/set "Fire"
#   govee-pixel/playlist/set "clock:30,screens:40,effect:Flow:20,animation:Victory:15,music:Spectrum:30,text:Hello:10"

automation:
  # Air quality alert: flash + sound when CO2 is high (example)
  - id: govee_pixel_co2_alert
    alias: "Govee Pixel: CO2 alert"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.living_room_co2                         # <-- CHANGE (or remove this automation)
        above: 1200
    actions:
      - action: mqtt.publish
        data:
          topic: govee-pixel/notify/set
          payload: >-
            {{ {"message": "CO2 " ~ states('sensor.living_room_co2') ~ " ppm - open a window",
                "duration": 30, "color": "#ff8800", "sound": "Tech"} | to_json }}

  # Front door: animation + chime (example)
  - id: govee_pixel_front_door
    alias: "Govee Pixel: someone at the door"
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_motion                # <-- CHANGE (doorbell / motion / contact sensor)
        to: "on"
    actions:
      - action: mqtt.publish
        data:
          topic: govee-pixel/notify/set
          payload: '{"message": "Someone at the front door", "duration": 20, "animation": "Danger Approaching", "sound": "Ding Dong"}'
