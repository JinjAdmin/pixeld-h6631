# /data/custom/ble.conf - BLE sensor bridge (bled). Edit over SSH, then: killall bled  (the wrapper restarts it)
# enabled=0               # turn the whole Bluetooth feature off (next boot)
# Scan duty cycle. Wi-Fi and BT share the RTL8723DS radio: 30/300 ms (10%) cost ~25% of Wi-Fi throughput,
# 30/1000 ms (3%) showed no measurable impact and still catches ~250 adverts/min.
interval_ms=1000
window_ms=30
# Publish each sensor at most this often (seconds); HA marks it unavailable after expire_s without data.
publish_s=60
expire_s=900
# discover=all            # every decoded sensor goes to Home Assistant (default)
# discover=listed         # only the sensors listed below (use this if neighbours' sensors show up)
# Name sensors by room, as "sensor=MAC Room" (the room becomes the Home Assistant name).
# Find MACs with: cat /tmp/ble_sensors
# sensor=A4:C1:38:12:34:56 Living
# ignore=AA:BB:CC:DD:EE:FF
